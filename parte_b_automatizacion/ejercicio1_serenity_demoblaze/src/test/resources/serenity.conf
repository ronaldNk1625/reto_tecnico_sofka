serenity {
    take.screenshots = AFTER_EACH_STEP
    test.root = "com.sofka.demoblaze"
    logging = VERBOSE
    console.colors = true
}

headless.mode = true

webdriver {
    driver = chrome
    autodownload = true
    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
            args = [
                "start-maximized",
                "test-type",
                "no-sandbox",
                "ignore-certificate-errors",
                "disable-popup-blocking",
                "disable-default-apps",
                "disable-extensions-file-access-check",
                "disable-infobars",
                "disable-gpu",
                "disable-dev-shm-usage",
                "remote-allow-origins=*",
                "headless=new"
            ]
        }
    }
    timeouts {
        implicitlywait = 10000
        fluentwait = 15000
    }
}

environments {
    default {
        webdriver.base.url = "https://www.demoblaze.com/"
    }
    prod {
        webdriver.base.url = "https://www.demoblaze.com/"
    }
}
